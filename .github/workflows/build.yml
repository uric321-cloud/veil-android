name: Build VEIL APK

on:
  push:
    # main plus any branch a Claude cloud session pushes, so the first push
    # from a session builds an installable APK without a merge step.
    branches: [ main, 'claude/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        id: name
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          FILE="VEIL-${VERSION}-build${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.file }}
          path: ${{ steps.name.outputs.file }}

      - name: Publish as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VEIL ${{ steps.name.outputs.version }} build ${{ github.run_number }}
          body: |
            Test build ${{ github.run_number }} from commit ${{ github.sha }}.
            Download the .apk below on your Android phone and open it to install.
          files: ${{ steps.name.outputs.file }}
