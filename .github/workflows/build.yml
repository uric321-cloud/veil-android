name: Build VEIL APK

on:
  push:
    # main plus any branch a Claude cloud session pushes, so the first push
    # from a session builds an installable APK without a merge step.
    branches: [ main, 'claude/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Deploys the admin backend from main once a NETLIFY_AUTH_TOKEN repository
      # secret exists (Netlify → User settings → Applications → Personal access tokens).
      - name: Deploy to Netlify
        if: github.ref == 'refs/heads/main' && env.NETLIFY_AUTH_TOKEN != ''
        env:
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID || 'fa6a9df0-6b6c-453d-bb13-7f8b8dd3639c' }}
        run: npx -y netlify-cli@27 deploy --build --prod --site "$NETLIFY_SITE_ID" --message "build ${{ github.run_number }} (${{ github.sha }})"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default list includes the legacy 'tools' package,
          # which the SDK repository no longer serves.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        id: name
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          FILE="VEIL-${VERSION}-build${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$FILE"
          # Stable name for Device Owner QR provisioning: releases/latest/download/VEIL.apk
          cp app/build/outputs/apk/release/app-release.apk VEIL.apk
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.file }}
          path: ${{ steps.name.outputs.file }}

      - name: Publish as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VEIL ${{ steps.name.outputs.version }} build ${{ github.run_number }}
          body: |
            Test build ${{ github.run_number }} from commit ${{ github.sha }}.
            Download the .apk below on your Android phone and open it to install.
          # Branch builds are pre-releases, so "latest" (used by QR provisioning) is always a main build.
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: |
            ${{ steps.name.outputs.file }}
            VEIL.apk
