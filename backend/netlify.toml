# Deployed with this folder as the base directory. Functions are TypeScript and
# bundled by Netlify; the dashboard in public/ is plain static files.
[build]
  publish = "public"
  command = "echo 'no build step'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Pairing links: /p/ABCD2345 shows a page that opens VEIL with the code filled in.
[[redirects]]
  from = "/p/*"
  to = "/p.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
